<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paper catalog | Paper Trail</title>
    <meta
      name="description"
      content="Search a shared catalog of research papers, add what is missing and correct what is wrong."
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components/form.css" />
    <link rel="stylesheet" href="css/catalog.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="site-header">
      <div class="wrap site-header__inner">
        <a class="site-header__brand" href="index.html">Paper Trail</a>
        <nav class="site-nav" aria-label="Main">
          <a href="index.html" aria-current="page">Catalog</a>
          <a href="list.html">My reading list</a>
        </nav>
      </div>
    </header>

    <main id="main" class="wrap">
      <h1>Paper catalog</h1>
      <p class="lede">
        Search papers seeded from OpenAlex. Add anything the catalog is missing, and
        correct metadata that came through wrong.
      </p>

      <form id="search-form" class="field-grid" role="search">
        <div class="field">
          <label for="q">Search</label>
          <input type="search" id="q" name="q" maxlength="120" />
        </div>

        <div class="field">
          <label for="field">Field</label>
          <select id="field" name="field">
            <option value="">All fields</option>
          </select>
        </div>

        <div class="field">
          <label for="year-from">From year</label>
          <input type="number" id="year-from" name="yearFrom" min="1500" max="2100" />
        </div>

        <div class="field">
          <label for="year-to">To year</label>
          <input type="number" id="year-to" name="yearTo" min="1500" max="2100" />
        </div>

        <div class="field field--actions">
          <button type="submit" class="button button--primary">Search</button>
          <button type="button" id="clear-search" class="button">Clear</button>
        </div>
      </form>

      <p id="search-error" class="form-error" role="alert" hidden></p>

      
      <div class="field">
         <label for="sort-papers">Sort papers by</label>
         <select id="sort-papers" name="sort">
            <option value="citations">Most cited</option>
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="title-asc">Title A-Z</option>
            <option value="title-desc">Title Z-A</option>
         </select>
      </div>

      
      <div class="catalog-actions">
        <button type="button" id="open-paper-dialog" class="button button--primary">
          Add a paper
        </button>
      </div>

      <dialog id="paper-dialog" class="dialog" aria-labelledby="form-heading">
        <div class="dialog__body">
          <h2 id="form-heading">Add a paper</h2>

          <form id="paper-form" class="field-grid">
            <input type="hidden" id="paper-id" name="paperId" value="" />

            <div class="field field--wide">
              <label for="title">Title</label>
              <input type="text" id="title" name="title" required maxlength="300" />
            </div>

            <div class="field field--wide">
              <label for="authors">
                Authors <span class="field__hint">comma separated</span>
              </label>
              <input type="text" id="authors" name="authors" />
            </div>

            <div class="field field--half">
              <label for="venue">Venue</label>
              <input type="text" id="venue" name="venue" maxlength="200" />
            </div>

            <div class="field">
              <label for="year">Year</label>
              <input type="number" id="year" name="year" min="1500" max="2100" />
            </div>

            <div class="field field--half">
              <label for="doi">DOI</label>
              <input type="text" id="doi" name="doi" maxlength="200" />
            </div>

            <div class="field field--wide">
              <label for="abstract">Abstract</label>
              <textarea
                id="abstract"
                name="abstract"
                rows="4"
                maxlength="3000"
              ></textarea>
            </div>

            <div class="field field--actions">
              <button type="submit" id="submit-button" class="button button--primary">
                Add paper
              </button>
              <button type="button" id="cancel-edit" class="button">Cancel</button>
            </div>
          </form>

          <p id="form-error" class="form-error" role="alert" hidden></p>
        </div>
      </dialog>

      <section aria-labelledby="results-heading">
        <h2 id="results-heading">Results</h2>
        <p id="status" class="status" role="status">Loading the catalog...</p>
        <p id="save-message" class="status" role="status"></p>

        <ul id="results" class="card-grid"></ul>

        <nav id="pager" class="pager" aria-label="Pagination" hidden>
          <button type="button" id="prev" class="button">Previous</button>
          <span id="page-label" class="pager__label"></span>
          <button type="button" id="next" class="button">Next</button>
        </nav>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>CS 5610 Web Development, Northeastern University.</p>
      </div>
    </footer>

    <script type="module" src="js/catalog.js"></script>
  </body>
</html>
